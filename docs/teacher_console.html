<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OmniGrade 教師管理與審卷主控台 v4.8</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 6 Pro -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- PDF.js Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- jsPDF Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- KaTeX Formula Typography -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    tailwind.config = {
      theme: { extend: { colors: { brand: { 50: '#eef8f8', 100: '#d7f0f0', 600: '#126a73', 700: '#0e535a', 800: '#0b3e43' } } } }
    };
  </script>

  <style>
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 999px; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 999px; border: 2px solid #f1f5f9; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    .teacher-mark-canvas { touch-action: none; cursor: crosshair; }
    .canvas-pan-mode { cursor: grab !important; touch-action: pan-y !important; }
    .canvas-pan-mode:active { cursor: grabbing !important; }
    .enhance-pencil { filter: contrast(185%) brightness(92%); }
    .katex-display { margin: 0.3em 0 !important; }
  </style>
<script src="./deployment.js" defer></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans select-none antialiased overflow-x-hidden">

  <header class="bg-slate-900 text-white h-14 flex items-center justify-between px-3 sm:px-6 z-40 shrink-0 border-b border-slate-800 shadow-sm sticky top-0">
    <div class="flex items-center space-x-3">
      <div class="flex items-center gap-2 cursor-pointer" onclick="switchTeacherTab('library')">
        <div class="w-8 h-8 rounded-xl bg-teal-600 flex items-center justify-center text-white font-black text-sm shadow-md">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="font-bold text-sm tracking-tight text-white hidden sm:inline">OmniGrade <span class="text-teal-400 font-mono text-xs">v4.8</span></span>
        </div>
      </div>
      <div class="h-4 w-px bg-slate-700 hidden sm:block"></div>
      <div class="flex items-center gap-1.5 bg-slate-800/90 px-2.5 py-1 rounded-xl border border-slate-700 text-xs">
        <i class="fa-solid fa-book-bookmark text-amber-400 text-xs"></i>
        <select id="globalExamSelect" onchange="switchGlobalExam(this.value)" class="bg-transparent text-xs font-bold text-slate-200 focus:outline-none cursor-pointer max-w-[140px] sm:max-w-[210px] truncate"></select>
      </div>
    </div>
    <div class="flex items-center gap-1.5 sm:gap-2">
      <button type="button" onclick="switchTeacherTab('library')" id="navBtnLibrary" class="px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition flex items-center gap-1.5 cursor-pointer"><i class="fa-solid fa-folder-open text-amber-400"></i><span class="hidden md:inline">試卷庫與匯入</span></button>
      <button type="button" onclick="switchTeacherTab('console')" id="navBtnConsole" class="px-2.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 bg-teal-700 text-white shadow-xs cursor-pointer"><i class="fa-solid fa-table-columns"></i><span class="hidden md:inline">雙欄審卷台</span></button>
      <button type="button" onclick="switchTeacherTab('roster')" id="navBtnRoster" class="px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition flex items-center gap-1.5 cursor-pointer"><i class="fa-solid fa-users text-emerald-400"></i><span class="hidden md:inline">名冊與成績</span></button>
      <button type="button" onclick="openShareModal()" class="px-2.5 py-1.5 rounded-lg text-xs font-bold bg-emerald-600 hover:bg-emerald-500 text-white transition flex items-center gap-1 shadow-xs cursor-pointer" title="本機一鍵模擬派卷"><i class="fa-solid fa-paper-plane text-[11px]"></i><span class="hidden sm:inline">派卷</span></button>
      <button type="button" onclick="openApiModal()" class="px-2 py-1.5 rounded-lg text-slate-400 hover:text-amber-300 hover:bg-slate-800 transition text-xs cursor-pointer" title="Gemini API Key 金鑰池與 GAS 設定"><i class="fa-solid fa-key"></i></button>
      <button type="button" onclick="logoutTeacherToHome()" class="px-2.5 py-1.5 rounded-lg text-xs font-bold text-rose-300 hover:text-white bg-slate-800 hover:bg-rose-950/70 border border-rose-500/40 transition flex items-center gap-1.5 cursor-pointer ml-1" title="登出並返回系統入口"><i class="fa-solid fa-arrow-right-from-bracket"></i><span class="hidden sm:inline">登出系統</span></button>
    </div>
  </header>

  <main class="flex-1 flex flex-col min-h-0 overflow-hidden relative">

    <!-- 分頁 1: 試卷庫與匯入 -->
    <section id="teacherTab-library" class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 bg-slate-100">
      <div class="max-w-5xl mx-auto space-y-6">
        <div class="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm flex items-center justify-between flex-wrap gap-3">
          <div>
            <div class="flex items-center gap-2">
              <span class="w-8 h-8 rounded-xl bg-teal-100 text-teal-800 flex items-center justify-center text-sm font-bold"><i class="fa-solid fa-folder-tree"></i></span>
              <h2 class="text-base font-bold text-slate-900">試卷資料庫與多頁試卷 AI 辨識導入</h2>
            </div>
            <p class="text-xs text-slate-500 mt-1">管理各次評量試卷，每份考卷清楚標註匯入日期時間，並可刪除或派卷。</p>
          </div>
          <div class="flex items-center gap-2 flex-wrap">
            <button type="button" onclick="loadDefaultDemoExam()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold border border-slate-200 transition cursor-pointer">重載示範段考卷</button>
            <button type="button" onclick="openImportExamModal()" class="px-4 py-2 bg-teal-700 hover:bg-teal-600 text-white rounded-xl text-xs font-bold transition shadow-xs flex items-center gap-1.5 cursor-pointer">
              <i class="fa-solid fa-wand-magic-sparkles text-amber-300"></i><span>多頁試卷 AI 辨識導入</span>
            </button>
          </div>
        </div>
        <div id="examLibraryCardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </div>
    </section>

    <!-- 分頁 2: 雙欄審卷台 -->
    <section id="teacherTab-console" class="hidden flex-1 flex flex-col h-full w-full min-h-0 overflow-hidden">
      <!-- 頂部常駐看板 -->
      <div class="bg-slate-900 text-white px-3 sm:px-4 py-2 flex items-center justify-between flex-wrap gap-2 border-b border-slate-800 shadow-md z-30 shrink-0">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="text-xs text-teal-300 font-bold flex items-center gap-1"><i class="fa-solid fa-user-graduate"></i> 審查學生：</span>
          <select id="consoleStudentSelectTop" onchange="switchConsoleStudent(this.value)" class="bg-slate-800 text-amber-300 font-bold text-xs rounded-lg px-2.5 py-1 border border-slate-700 focus:outline-none"></select>
          <span id="topBarGradedBadge" class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-teal-950 text-teal-300 border border-teal-700">客觀題秒批</span>
          <button type="button" onclick="batchConfirmCurrentSubmission()" class="px-3 py-1 bg-teal-700 hover:bg-teal-600 text-white rounded-lg text-xs font-bold transition flex items-center gap-1 shadow-xs cursor-pointer">重新自動判分</button>
        </div>
        <div class="flex items-center gap-2 sm:gap-3 flex-wrap font-mono text-xs">
          <div class="flex items-center gap-1 bg-slate-800 px-2 py-1 rounded-lg border border-slate-700"><span class="text-slate-400 font-sans text-[11px]">選擇:</span><span id="topScoreChoice" class="text-teal-300 font-bold">--</span></div>
          <div class="flex items-center gap-1 bg-slate-800 px-2 py-1 rounded-lg border border-slate-700"><span class="text-slate-400 font-sans text-[11px]">填充:</span><span id="topScoreFill" class="text-teal-300 font-bold">--</span></div>
          <div class="flex items-center gap-1.5 bg-rose-950 px-2.5 py-1 rounded-xl border border-rose-500/80 shadow-inner"><span class="text-rose-300 font-bold font-sans text-xs">實得:</span><span id="topScoreTotal" class="text-rose-400 font-black text-base">--</span></div>
          <div class="flex items-center gap-1 ml-1">
            <button type="button" onclick="saveGradingProgress(true)" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-emerald-500/40 rounded-lg text-xs font-bold transition flex items-center gap-1 cursor-pointer"><i class="fa-solid fa-floppy-disk"></i> 儲存</button>
            <button type="button" onclick="finalizeAndReleaseCurrentStudent()" class="px-3 py-1 bg-emerald-700 hover:bg-emerald-600 text-white rounded-lg text-xs font-bold transition flex items-center gap-1 shadow-xs cursor-pointer"><i class="fa-solid fa-paper-plane text-[10px]"></i> 核定發還</button>
            <button type="button" onclick="openEmailModalForCurrentStudent()" class="px-2.5 py-1 bg-sky-700 hover:bg-sky-600 text-white rounded-lg text-xs font-bold transition flex items-center gap-1 cursor-pointer"><i class="fa-solid fa-envelope"></i> 通知</button>
          </div>
        </div>
      </div>

      <!-- 次導覽列 -->
      <div class="bg-white border-b border-slate-200 px-3 sm:px-4 py-1.5 flex items-center justify-between flex-wrap gap-2 shrink-0 z-20">
        <div class="flex items-center gap-1.5 overflow-x-auto py-0.5">
          <span class="text-xs font-bold text-slate-700 bg-slate-100 px-2.5 py-1 rounded-lg border border-slate-200"><i class="fa-solid fa-sheet-plastic text-teal-700 mr-1"></i>客觀題答題卡審卷</span>
        </div>
        <div class="flex items-center bg-slate-100 p-0.5 rounded-xl border border-slate-200 text-xs shrink-0 flex-wrap gap-0.5">
          <span class="text-[11px] font-bold text-slate-500 px-1.5">版面:</span>
          <button type="button" onclick="setConsoleSplitMode('left-only')" id="btnSplitLeftOnly" class="px-2 py-0.5 rounded-lg font-medium text-slate-600 hover:bg-white transition cursor-pointer">◀ 僅看原卷</button>
          <button type="button" onclick="setConsoleSplitMode('left-wide')" id="btnSplitLeftWide" class="px-2 py-0.5 rounded-lg font-medium text-slate-600 hover:bg-white transition cursor-pointer">原卷 70%</button>
          <button type="button" onclick="setConsoleSplitMode('split')" id="btnSplitEqual" class="px-2 py-0.5 rounded-lg font-bold bg-teal-700 text-white shadow-xs transition cursor-pointer">⚖ 平分</button>
          <button type="button" onclick="setConsoleSplitMode('right-wide')" id="btnSplitRightWide" class="px-2 py-0.5 rounded-lg font-medium text-slate-600 hover:bg-white transition cursor-pointer">規準 70%</button>
          <button type="button" onclick="setConsoleSplitMode('right-only')" id="btnSplitRightOnly" class="px-2 py-0.5 rounded-lg font-medium text-slate-600 hover:bg-white transition cursor-pointer">僅看規準 ▶</button>
        </div>
      </div>

      <!-- 雙欄工作區 -->
      <div class="flex-1 flex flex-col lg:flex-row min-h-0 overflow-hidden relative" id="consoleMainContainer">
        <!-- 左欄原卷 -->
        <div id="consoleLeftPanel" class="w-full lg:w-1/2 flex flex-col border-r border-slate-200 bg-slate-200/80 h-full min-h-0">
          <div class="bg-white/95 backdrop-blur px-3 py-1.5 border-b border-slate-200 z-20 flex items-center justify-between flex-wrap gap-2 text-xs shrink-0">
            <div class="flex items-center gap-1 flex-wrap">
              <span class="text-[11px] font-bold text-slate-700 mr-1"><i class="fa-solid fa-pen-nib text-rose-600"></i> 工具：</span>
              <button type="button" onclick="setTeacherDrawTool('pan')" id="btnTeacherPan" class="px-2.5 py-1 rounded-lg font-medium text-slate-700 hover:bg-slate-100 cursor-pointer flex items-center gap-1"><i class="fa-solid fa-hand text-slate-600 text-[10px]"></i> 拖曳平移</button>
              <button type="button" onclick="setTeacherDrawTool('pen')" id="btnTeacherPen" class="px-2.5 py-1 rounded-lg font-bold bg-rose-600 text-white shadow-xs cursor-pointer flex items-center gap-1"><i class="fa-solid fa-pen text-[10px]"></i> 紅筆</button>
              <button type="button" onclick="setTeacherDrawTool('highlighter')" id="btnTeacherHighlighter" class="px-2.5 py-1 rounded-lg font-medium text-slate-700 hover:bg-slate-100 cursor-pointer flex items-center gap-1"><i class="fa-solid fa-highlighter text-amber-500 text-[10px]"></i> 螢光筆</button>
              <button type="button" onclick="setTeacherDrawTool('eraser')" id="btnTeacherEraser" class="px-2.5 py-1 rounded-lg font-medium text-slate-700 hover:bg-slate-100 cursor-pointer flex items-center gap-1"><i class="fa-solid fa-eraser text-slate-500 text-[10px]"></i> 橡皮擦</button>

              <div class="flex items-center gap-1 bg-rose-50 p-0.5 rounded-lg border border-rose-200 ml-1">
                <button type="button" onclick="activateStampPlacement('check')" class="px-2 py-0.5 rounded text-rose-700 hover:bg-rose-100 font-black text-xs cursor-pointer">✓ 紅勾</button>
                <button type="button" onclick="activateStampPlacement('cross')" class="px-2 py-0.5 rounded text-rose-700 hover:bg-rose-100 font-black text-xs cursor-pointer">✗ 紅叉</button>
                <button type="button" onclick="activateStampPlacement('partial')" class="px-2 py-0.5 rounded text-rose-700 hover:bg-rose-100 font-bold text-xs cursor-pointer">△ 步驟分</button>
              </div>
              <button type="button" onclick="undoTeacherMark()" class="px-2 py-1 text-slate-600 hover:bg-slate-100 rounded-lg text-xs font-medium cursor-pointer ml-1"><i class="fa-solid fa-rotate-left"></i></button>
              <button type="button" onclick="clearCurrentPageTeacherMarks()" class="px-2 py-1 text-rose-600 hover:bg-rose-50 rounded-lg text-xs font-medium cursor-pointer"><i class="fa-solid fa-trash-can"></i></button>
            </div>
            <div class="flex items-center gap-1.5 flex-wrap">
              <div class="flex items-center bg-slate-100 p-0.5 rounded-lg border border-slate-200 text-xs">
                <button type="button" onclick="setConsoleCanvasZoom('fit')" id="btnZoomFit" class="px-2 py-0.5 rounded font-bold text-[11px] bg-white text-teal-800 shadow-2xs cursor-pointer">適應寬度</button>
                <button type="button" onclick="setConsoleCanvasZoom('100')" id="btnZoom100" class="px-2 py-0.5 rounded font-medium text-[11px] text-slate-600 hover:text-slate-900 cursor-pointer">100%</button>
              </div>
              <button type="button" onclick="toggleContrastEnhance()" id="btnContrast" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium transition cursor-pointer">鉛筆增強</button>
            </div>
          </div>
          <div id="consoleLeftScrollContainer" class="flex-1 min-h-0 overflow-y-auto overflow-x-auto p-3 sm:p-4 flex flex-col items-center">
            <div id="consoleCanvasWrapper" class="relative bg-white shadow-lg rounded-xl overflow-hidden border border-slate-300 transition-all duration-150 origin-top">
              <canvas id="consolePaperCanvas" class="w-full block"></canvas>
              <canvas id="teacherMarkCanvas" class="w-full absolute inset-0 block teacher-mark-canvas"></canvas>
            </div>
          </div>
        </div>

        <!-- 右欄規準與判分 -->
        <div id="consoleRightPanel" class="w-full lg:w-1/2 bg-white flex flex-col h-full min-h-0">
          <div class="p-3 bg-teal-50/70 border-b border-teal-200 shrink-0 space-y-2">
            <div class="flex items-center justify-between flex-wrap gap-2">
              <div class="flex items-center gap-2"><span class="w-6 h-6 rounded-lg bg-teal-700 text-white flex items-center justify-center text-xs font-bold"><i class="fa-solid fa-bolt"></i></span><span class="font-bold text-xs text-teal-950">全卷客觀題自動等價驗證看板</span></div>
              <button type="button" onclick="batchConfirmCurrentSubmission()" class="px-4 py-1.5 bg-teal-700 hover:bg-teal-600 text-white rounded-xl font-bold text-xs shadow-xs transition flex items-center gap-1.5 cursor-pointer"><i class="fa-solid fa-check-double text-amber-300"></i><span>✓ 全卷無爭議 · 一鍵核定通過</span></button>
            </div>
            <div class="flex items-center justify-between text-xs bg-white p-2 rounded-xl border border-teal-200">
              <span id="doubtSummaryText" class="text-slate-600">全卷由系統完成形式檢定。</span>
              <div class="flex items-center gap-1">
                <button type="button" onclick="filterQuestionPills('all')" id="btnFilterAll" class="px-2 py-0.5 rounded-lg font-bold bg-teal-700 text-white text-[11px] cursor-pointer">全部題目</button>
                <button type="button" onclick="filterQuestionPills('doubt')" id="btnFilterDoubt" class="px-2 py-0.5 rounded-lg font-medium text-amber-800 bg-amber-100 hover:bg-amber-200 text-[11px] cursor-pointer">⚠️ 僅看存疑題</button>
              </div>
            </div>
          </div>
          <div class="p-2.5 border-b border-slate-100 flex items-center justify-between gap-2 shrink-0 bg-white">
            <div class="flex items-center gap-1.5 flex-wrap overflow-x-auto py-0.5" id="consoleQuestionPills"></div>
          </div>
          <div id="consoleRightScrollContainer" class="flex-1 min-h-0 overflow-y-auto p-4 space-y-4">
            <div id="consoleQuestionDetailCard" class="space-y-4"></div>
          </div>
          <div class="bg-slate-50 border-t border-slate-200 p-3 shrink-0 flex justify-between gap-2">
             <button type="button" onclick="exportConfirmedGradedPaperPdf()" class="px-4 py-2 bg-teal-700 text-white rounded-xl font-bold text-xs"><i class="fa-solid fa-file-pdf"></i> 匯出正式批閱 PDF</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 分頁 3: 名冊與成績 -->
    <section id="teacherTab-roster" class="hidden flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 bg-slate-100">
      <div class="max-w-6xl mx-auto space-y-5">
        <div class="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm flex items-center justify-between flex-wrap gap-3">
          <div>
            <h2 class="text-base font-bold text-slate-900 flex items-center gap-2"><i class="fa-solid fa-users text-teal-700"></i> 全班名冊與成績登記表</h2>
          </div>
          <div class="flex items-center gap-2">
            <button type="button" onclick="syncSubmissionsFromCloud()" class="px-3 py-2 bg-sky-700 hover:bg-sky-600 text-white rounded-xl text-xs font-bold transition shadow-xs cursor-pointer"><i class="fa-solid fa-cloud-arrow-down"></i> <span>同步雲端繳交</span></button>
            <button type="button" onclick="publishAllExamResults()" class="px-3.5 py-2 bg-teal-700 hover:bg-teal-600 text-white rounded-xl text-xs font-bold transition shadow-xs cursor-pointer"><i class="fa-solid fa-bullhorn"></i> 正式發布成績</button>
          </div>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
          <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs"><span class="text-slate-500">應試人數</span><div class="text-xl font-black text-slate-900 mt-1" id="statStudentCount">--</div></div>
          <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs"><span class="text-slate-500">已繳交人數</span><div class="text-xl font-black text-teal-700 mt-1" id="statSubmittedCount">--</div></div>
          <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs"><span class="text-slate-500">全班平均成績</span><div class="text-xl font-black text-amber-600 mt-1" id="statAverageScore">--</div></div>
          <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs"><span class="text-slate-500">及格率 (&ge; 60分)</span><div class="text-xl font-black text-emerald-600 mt-1" id="statPassRate">--</div></div>
        </div>
        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead><tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-bold"><th class="py-3 px-4">座號</th><th class="py-3 px-4">姓名</th><th class="py-3 px-4">學號</th><th class="py-3 px-4">狀態</th><th class="py-3 px-4 text-rose-600">實得總分</th><th class="py-3 px-4 text-center">操作</th></tr></thead>
              <tbody id="rosterTableBody" class="divide-y divide-slate-100 font-mono"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 相關彈窗 -->
  <div id="importExamModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-3 sm:p-6"><div class="bg-white rounded-3xl shadow-2xl w-full max-w-4xl p-6"><div class="flex justify-between"><h3 class="font-bold">AI 匯入</h3><button onclick="closeImportExamModal()">X</button></div></div></div>
  <div id="deleteExamConfirmModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-3 sm:p-6"><div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-6"><div class="flex justify-between"><h3 class="font-bold text-rose-600">確認刪除？</h3><button onclick="closeDeleteExamModal()">X</button></div></div></div>
  
  <div id="shareExamModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-3 sm:p-6">
    <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 w-full max-w-md p-6 space-y-4 text-xs">

      <div class="space-y-3">
        <div><label class="block font-bold">黑板投影課堂測驗碼：</label><div class="p-3 bg-emerald-50 rounded-2xl text-center"><span class="font-mono text-2xl font-black text-emerald-800" id="shareExamCodeDisplay">MATH-115</span></div></div>
        <div><label class="block font-bold">學生受測端專屬連結：</label><input type="text" id="shareExamUrlInput" readonly class="w-full bg-slate-50 border p-2 font-mono text-[11px] text-slate-600 select-all"></div>

      <div class="space-y-3">
        <div><label class="block font-bold">GAS 部署網址：</label><input type="text" id="inputGasDeploymentUrl" class="w-full bg-slate-50 border rounded-xl px-3 py-2"></div>
        <div><label class="block font-bold">API 金鑰池 (一行一組)：</label><textarea id="inputGeminiApiKeysArea" rows="4" class="w-full bg-slate-50 border rounded-xl p-2.5"></textarea></div>
      </div>
      <div class="pt-2 flex justify-end"><button onclick="saveApiConfig()" class="px-5 py-2 bg-teal-700 text-white font-bold rounded-xl text-xs">儲存設定</button></div>
    </div>

  <div id="emailNotificationModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-3 sm:p-6">
    <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 w-full max-w-lg p-6 space-y-4 text-xs">
      <div class="flex justify-between border-b pb-3"><h3 class="font-bold">成績通知信寄送</h3><button onclick="closeEmailModal()">X</button></div>
      <div class="space-y-2">
        <div><label class="block font-bold">收件信箱：</label><input type="text" id="emailRecipientInput" class="w-full bg-slate-50 border rounded-xl px-3 py-1.5"></div>
        <div><label class="block font-bold">信件主旨：</label><input type="text" id="emailSubjectInput" class="w-full bg-slate-50 border rounded-xl px-3 py-1.5"></div>
        <div><label class="block font-bold">教師總評內容：</label><textarea id="emailCommentInput" rows="3" class="w-full bg-slate-50 border rounded-xl p-2.5"></textarea></div>
      </div>
      <div class="flex justify-end pt-2 gap-2"><button onclick="sendViaWebmailDirect()" class="px-3.5 py-2 bg-slate-100 font-bold rounded-xl text-xs">Gmail 寄發</button><button onclick="sendViaGasCloudApi()" id="btnGasSendEmail" class="px-4 py-2 bg-sky-700 text-white font-bold rounded-xl text-xs">GAS 雲端自動寄出</button></div>
    </div>
  </div>

  <div id="teacherToast" class="hidden fixed bottom-6 right-6 bg-slate-900/95 text-white px-5 py-3 rounded-2xl shadow-2xl text-xs z-50 flex items-center gap-2.5 border border-slate-700">
    <i class="fa-solid fa-circle-check text-emerald-400" id="toastIcon"></i><span id="toastMsg">操作成功</span>
  </div>

  <script>
    // ==========================================
    // 【重要設定】Google 協作平台首頁絕對網址
    // ==========================================
    const ROUTES = {
      home: new URL('./index.html', location.href).href,       // 請替換
      student: new URL('./student_portal.html', location.href).href // 請替換
    };

    const DB_KEY = 'omnigrade_math_db_v2';
    let appState = {
      activeExamId: 'EXAM-MATH-01', activeStudentId: 'S11201', selectedQuestionId: 'choice_1', activeQuestionFilter: 'all', splitMode: 'split',
      canvasZoom: 1.0, isContrastEnhanced: false, currentTool: 'pen', uploadedPdfPages: [], tempImportQuestions: [],
      gasUrl: '' || '', apiKeys: JSON.parse('[]' || '[]'),
      activeKeyIndex: 0, examLibrary: []
    };

    function showToast(msg, isSuccess = true) {
      const toast = document.getElementById('teacherToast'); const msgEl = document.getElementById('toastMsg'); const iconEl = document.getElementById('toastIcon');
      if (!toast || !msgEl || !iconEl) return;
      msgEl.textContent = msg; iconEl.className = isSuccess ? 'fa-solid fa-circle-check text-emerald-400' : 'fa-solid fa-circle-exclamation text-amber-400';
      toast.classList.remove('hidden'); clearTimeout(window._toastTimer); window._toastTimer = setTimeout(() => toast.classList.add('hidden'), 2800);
    }

    function getActiveExam() {
      let exam = appState.examLibrary.find(e => e.id === appState.activeExamId);
      if (!exam) { exam = appState.examLibrary[0] || buildDefaultExam(); appState.activeExamId = exam.id; }
      return exam;
    }

    function saveAllData() { try { localStorage.setItem(DB_KEY, JSON.stringify(appState.examLibrary)); } catch (err) {} }
    function saveGradingProgress(notify = true) { saveAllData(); if (notify) showToast('✓ 作答紀錄與評分進度已成功儲存！', true); }

    function populateExamSelect() {
      const select = document.getElementById('globalExamSelect');
      if (select) select.innerHTML = appState.examLibrary.map(e => `<option value="${e.id}" ${e.id === appState.activeExamId ? 'selected' : ''}>${e.code} - ${e.title}</option>`).join('');
    }

    function switchGlobalExam(examId) {
      appState.activeExamId = examId;
      const exam = getActiveExam();
      if (exam && exam.submissions) {
        const studentIds = Object.keys(exam.submissions);
        if (studentIds.length > 0 && !studentIds.includes(appState.activeStudentId)) appState.activeStudentId = studentIds[0];
        if (exam.questions && exam.questions.length > 0) appState.selectedQuestionId = exam.questions[0].id;
      }
      saveAllData(); populateExamSelect(); renderLibraryCards(); renderRosterTable(); setupConsoleView();
    }

    function renderLibraryCards() {
      const container = document.getElementById('examLibraryCardsGrid');
      if (!container) return;
      container.innerHTML = appState.examLibrary.map(exam => {
        const subCount = Object.keys(exam.submissions || {}).length;
        const qCount = (exam.questions || []).length;
        return `
          <div class="bg-white rounded-3xl p-5 border shadow-sm flex flex-col space-y-4">
            <div><span class="text-xs font-mono bg-teal-50 text-teal-800 px-2 py-0.5">${exam.code}</span><h3 class="font-bold text-sm mt-2">${exam.title}</h3></div>
            <div class="flex gap-2"><button onclick="switchGlobalExam('${exam.id}'); switchTeacherTab('console');" class="flex-1 py-2 bg-teal-700 text-white rounded-xl text-xs font-bold">進入審卷</button></div>
          </div>
        `;
      }).join('');
    }

    function renderRosterTable() {
      const exam = getActiveExam();
      const subs = Object.values(exam.submissions || {});
      const tbody = document.getElementById('rosterTableBody');
      if (!tbody) return;
      tbody.innerHTML = subs.map(s => `<tr><td class="py-3 px-4">${s.seat}號</td><td class="py-3 px-4">${s.name}</td><td class="py-3 px-4">${s.studentId}</td><td class="py-3 px-4">${s.status}</td><td class="py-3 px-4 text-rose-600 font-bold">計算中</td><td class="py-3 px-4 text-center"><button onclick="appState.activeStudentId = '${s.studentId}'; switchTeacherTab('console');" class="bg-teal-50 px-2 py-1 rounded">審卷</button></td></tr>`).join('');
    }

    function logoutTeacherToHome() {
      sessionStorage.removeItem('omnigrade_teacher_logged_in');
      showToast('已登出教師主控台，正在返回入口首頁...', true);
      setTimeout(() => { window.location.href = ROUTES.home; }, 350);
    }

    function switchTeacherTab(tabName) {
      ['library', 'console', 'roster'].forEach(t => {
        const el = document.getElementById(`teacherTab-${t}`);
        if (el) el.classList[t === tabName ? 'remove' : 'add']('hidden');
      });
      if (tabName === 'library') renderLibraryCards();
      else if (tabName === 'console') setupConsoleView();
      else if (tabName === 'roster') renderRosterTable();
    }

    function buildDefaultExam() {
      return { id: 'EXAM-MATH-01', title: '115 國中數學 1 上名師猜題卷 (第一次段考)', code: 'MATH-115', passScore: 60, questions: [], submissions: {} };
    }

    function initDataStorage() {
      try { const stored = localStorage.getItem(DB_KEY); if (stored) appState.examLibrary = JSON.parse(stored); } catch (e) {}
      if (!appState.examLibrary || appState.examLibrary.length === 0) { appState.examLibrary = [buildDefaultExam()]; saveAllData(); }
      populateExamSelect(); renderLibraryCards(); renderRosterTable(); setupConsoleView(); initTeacherMarkCanvasEvents();
    }

    function initTeacherMarkCanvasEvents() {
      const markCanvas = document.getElementById('teacherMarkCanvas');
      const scrollContainer = document.getElementById('consoleLeftScrollContainer');
      if (!markCanvas || !scrollContainer) return;

      let isDrawing = false; let lastX = 0, lastY = 0; let panStartX = 0, panStartY = 0; let scrollStartX = 0, scrollStartY = 0;
      let isGlobalSpacePressed = false;
      window.addEventListener('keydown', e => { if (e.code === 'Space') isGlobalSpacePressed = true; });
      window.addEventListener('keyup', e => { if (e.code === 'Space') isGlobalSpacePressed = false; });

      const getExactPos = (e) => {
        const rect = markCanvas.getBoundingClientRect();
        let cx = e.clientX, cy = e.clientY;
        if (e.touches && e.touches.length > 0) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
        const scaleX = rect.width > 0 ? (markCanvas.width / rect.width) : 1; const scaleY = rect.height > 0 ? (markCanvas.height / rect.height) : 1;
        return { x: (cx - rect.left) * scaleX, y: (cy - rect.top) * scaleY };
      };

      const handleStart = (e) => {
        if (appState.currentTool === 'pan' || isGlobalSpacePressed) {
          isDrawing = 'pan';
          panStartX = (e.touches ? e.touches[0].clientX : e.clientX); panStartY = (e.touches ? e.touches[0].clientY : e.clientY);
          scrollStartX = scrollContainer.scrollLeft; scrollStartY = scrollContainer.scrollTop;
          return;
        }
        if (e.cancelable) e.preventDefault();
        const pos = getExactPos(e); lastX = pos.x; lastY = pos.y;
        if (appState.currentTool && appState.currentTool.startsWith('stamp_')) {
          const type = appState.currentTool.replace('stamp_', ''); const ctx = markCanvas.getContext('2d');
          ctx.save(); ctx.font = 'bold 32px sans-serif'; ctx.fillStyle = type === 'partial' ? '#ea580c' : '#dc2626';
          ctx.fillText(type === 'check' ? '✓' : (type === 'cross' ? '✗' : '△'), lastX - 16, lastY + 12);
          ctx.restore(); appState.currentTool = 'pen'; setTeacherDrawTool('pen'); return;
        }
        isDrawing = 'draw'; const ctx = markCanvas.getContext('2d');
        ctx.globalCompositeOperation = appState.currentTool === 'eraser' ? 'destination-out' : 'source-over';
        ctx.lineWidth = appState.currentTool === 'eraser' ? 26 : 3.5;
        ctx.strokeStyle = appState.currentTool === 'eraser' ? 'rgba(0,0,0,1)' : '#dc2626';
        ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(lastX, lastY);
      };

      const handleMove = (e) => {
        if (!isDrawing) return;
        if (isDrawing === 'pan') {
          const cx = (e.touches ? e.touches[0].clientX : e.clientX); const cy = (e.touches ? e.touches[0].clientY : e.clientY);
          scrollContainer.scrollLeft = scrollStartX - (cx - panStartX); scrollContainer.scrollTop = scrollStartY - (cy - panStartY); return;
        }
        if (e.cancelable) e.preventDefault();
        const pos = getExactPos(e); const ctx = markCanvas.getContext('2d'); ctx.lineTo(pos.x, pos.y); ctx.stroke(); lastX = pos.x; lastY = pos.y;
      };

      markCanvas.onmousedown = handleStart; markCanvas.onmousemove = handleMove; window.addEventListener('mouseup', () => { isDrawing = false; });
    }

    function setupConsoleView() { }
    function setConsoleSplitMode(mode) {}
    function setTeacherDrawTool(tool) { appState.currentTool = tool; }
    function activateStampPlacement(type) { appState.currentTool = `stamp_${type}`; }
    function undoTeacherMark() {}
    function clearCurrentPageTeacherMarks() {}
    function toggleContrastEnhance() {}
    function openApiModal() { document.getElementById('apiConfigModal').classList.remove('hidden'); }
    function closeApiModal() { document.getElementById('apiConfigModal').classList.add('hidden'); }
    
    function openShareModal() {
      const exam = getActiveExam();
      document.getElementById('shareExamCodeDisplay').textContent = exam.code;
      // 派卷網址自動帶入 ROUTES.student 設定的絕對路徑
      document.getElementById('shareExamUrlInput').value = `${ROUTES.student}?code=${exam.code}`;
      document.getElementById('shareExamModal').classList.remove('hidden');
    }
    
    function closeShareModal() { document.getElementById('shareExamModal').classList.add('hidden'); }
    function copyShareExamUrl() {
      const input = document.getElementById('shareExamUrlInput');
      input.select();
      navigator.clipboard.writeText(input.value);
      showToast('✓ 學生專屬作答網址已複製至剪貼簿！', true);
    }
    
    function syncSubmissionsFromCloud() {}
    function publishAllExamResults() {}
    function openEmailModalForCurrentStudent() {}
    function closeEmailModal() {}
    
    window.onload = function() { initDataStorage(); };
  </script>
